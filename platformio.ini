; Replacement firmware for the ESP32-WROOM-32E inside a Honeywell HTRAM-V1-W.
;
;   pio run -e htram -t upload --upload-port COMxx   (first flash, over UART0)
;   pio run -e htram_ota -t upload                   (later, over Wi-Fi)

[env:htram]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
; HomeSpan 1.9.x is the last line built for Arduino-ESP32 2.0.x (2.x needs 3.x).
lib_deps = homespan/HomeSpan@~1.9.1

[env:htram_ota]
extends = env:htram
upload_protocol = espota
upload_port = htram.local
upload_flags = --auth=htram-ota
