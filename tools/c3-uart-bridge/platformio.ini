; USB <-> UART bridge for an ESP32-C3 SuperMini.
; The C3's native USB shows up as a COM port; bytes are passed to/from
; UART1 on GPIO20 (RX) / GPIO21 (TX) at a fixed baud chosen per env.

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:b460800]
build_flags = ${env.build_flags} -DBRIDGE_BAUD=460800

[env:b115200]
build_flags = ${env.build_flags} -DBRIDGE_BAUD=115200

[env:probe]
build_flags = ${env.build_flags} -DPROBE_PINS

; Sniff the HTRAM's GD32 <-> ESP-AT link: module pin 27 (GPIO16, GD32 -> ESP)
; on C3 pin 3, module pin 28 (GPIO17, ESP -> GD32) on C3 pin 4.
[env:sniff_at]
build_flags = ${env.build_flags} -DPROBE_PINS
    -DPROBE_A_PIN=3 -DPROBE_A_TAG='"GD32>ESP"'
    -DPROBE_B_PIN=4 -DPROBE_B_TAG='"ESP>GD32"'

; Same sniffer plus a BLE central that connects to the HTRAM.
[env:sniff_ble]
board_build.partitions = huge_app.csv
build_flags = ${env:sniff_at.build_flags} -DBLE_CLIENT

[env:b115200_swap]
build_flags = ${env.build_flags} -DBRIDGE_BAUD=115200 -DSWAP_PINS
